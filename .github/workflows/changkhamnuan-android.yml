name: ChangKhamnuan (ช่างคำนวณ) Android build

on:
  push:
    branches: [ 'claude/lifekeep-**' ]
    paths:
      - 'changkhamnuan/**'
      - '.github/workflows/changkhamnuan-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changkhamnuan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: changkhamnuan
    env:
      OUT: ${{ github.workspace }}/changkhamnuan-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The project ships no gradlew script, so use the Gradle version from the wrapper properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Outputs of the previous build are committed on the branch: remove them so a failed
      # build can never be tested or shipped by mistake.
      - name: Remove previous build outputs
        working-directory: .
        run: rm -f changkhamnuan-build/*.apk changkhamnuan-build/*.aab changkhamnuan-build/TEST_SUMMARY.txt

      - name: Unit tests (JVM + Robolectric)
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-configuration-cache 2>&1 | tee ../ck-unit-tests.log

      - name: Build debug APK + release APK/AAB (unsigned)
        if: always()
        run: |
          set -o pipefail
          {
            # 1) store bundle, unsigned (signed later with the private upload key, outside CI)
            gradle :app:assembleDebug :app:bundleRelease --stacktrace --no-configuration-cache
            # 2) the same minified release build, signed with the debug key, only to test it on the emulator
            RELEASE_TEST_SIGN=1 gradle :app:assembleRelease --stacktrace --no-configuration-cache
          } 2>&1 | tee ../ck-build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$OUT/test-results"
          cp ../ck-unit-tests.log ../ck-build.log "$OUT/" || true
          cp app/build/outputs/apk/debug/*.apk "$OUT/ChangKhamnuan-debug.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk "$OUT/ChangKhamnuan-release-testsigned.apk" 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab "$OUT/ChangKhamnuan-release-unsigned.aab" 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml "$OUT/test-results/" 2>/dev/null || true
          if [ -d app/schemas ]; then cp -r app/schemas "$OUT/room-schemas"; fi
          python3 - "$OUT/test-results" > "$OUT/TEST_SUMMARY.txt" <<'PY' || true
          import sys, glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob(sys.argv[1]+'/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None:
                      print('FAILED:', r.get('name'), '>', c.get('name'))
          print(f'tests={t} failures={f} errors={e} skipped={s}')
          PY
          APK="$OUT/ChangKhamnuan-release-testsigned.apk"
          if [ -f "$APK" ]; then
            AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
            { "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission|INTERNET)";
              echo; ls -l "$OUT"/*.apk "$OUT"/*.aab 2>/dev/null | awk '{print $5, $9}'; } > "$OUT/artifact-inspection.txt"
          fi
          cat "$OUT/TEST_SUMMARY.txt" || true
          if grep -q "uses-permission" "$OUT/artifact-inspection.txt"; then echo "PERMISSIONS FOUND (app should request none)"; grep uses-permission "$OUT/artifact-inspection.txt"; fi

      - name: Enable KVM for the emulator
        if: always()
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install + launch on emulator (API 35)
        id: emu
        if: always() && hashFiles('changkhamnuan-build/ChangKhamnuan-release-testsigned.apk') != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: .
          script: |
            bash changkhamnuan/ci/emulator_smoke.sh changkhamnuan-build/ChangKhamnuan-release-testsigned.apk changkhamnuan-build/device
            bash changkhamnuan/ci/store_screenshots.sh changkhamnuan-build/ChangKhamnuan-debug.apk changkhamnuan-build/store-screenshots

      - name: Commit build outputs and reports
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "commit=${GITHUB_SHA::7} emulator=${{ steps.emu.outcome }}" > changkhamnuan-build/BUILD_INFO.txt
          git add -f changkhamnuan-build
          git commit -m "CI ChangKhamnuan build ${GITHUB_SHA::7} (emulator: ${{ steps.emu.outcome }})" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Fail if tests or build failed
        if: always()
        run: |
          grep -q "BUILD SUCCESSFUL" ../ck-unit-tests.log || { echo "unit tests failed"; exit 1; }
          [ "$(grep -c "BUILD SUCCESSFUL" ../ck-build.log)" = "2" ] || { echo "build failed"; exit 1; }
