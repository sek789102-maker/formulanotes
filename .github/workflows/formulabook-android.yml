name: FormulaBook Android build

on:
  push:
    branches: [ 'claude/lifekeep-**' ]
    paths:
      - 'formulabook/**'
      - '.github/workflows/formulabook-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formulabook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: formulabook
    env:
      OUT: ${{ github.workspace }}/formulabook-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project ships no gradlew script, so use the Gradle version from the wrapper properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests (JVM + Robolectric)
        run: gradle :app:testDebugUnitTest --stacktrace --no-configuration-cache 2>&1 | tee ../fb-unit-tests.log

      - name: Build debug APK + release APK/AAB (unsigned)
        if: always()
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace --no-configuration-cache 2>&1 | tee ../fb-build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$OUT/test-results"
          cp ../fb-unit-tests.log ../fb-build.log "$OUT/" || true
          cp app/build/outputs/apk/debug/*.apk "$OUT/FormulaBook-debug.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk "$OUT/FormulaBook-release-unsigned.apk" 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab "$OUT/FormulaBook-release-unsigned.aab" 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml "$OUT/test-results/" 2>/dev/null || true
          if [ -d app/schemas ]; then cp -r app/schemas "$OUT/room-schemas"; fi
          python3 - "$OUT/test-results" > "$OUT/TEST_SUMMARY.txt" <<'PY' || true
          import sys, glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob(sys.argv[1]+'/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              for c in r.iter('testcase'):
                  if c.find('failure') is not None or c.find('error') is not None:
                      print('FAILED:', r.get('name'), '>', c.get('name'))
          print(f'tests={t} failures={f} errors={e} skipped={s}')
          PY
          APK="$OUT/FormulaBook-debug.apk"
          if [ -f "$APK" ]; then
            AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
            { "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission)";
              echo; ls -l "$OUT"/*.apk "$OUT"/*.aab 2>/dev/null | awk '{print $5, $9}'; } > "$OUT/artifact-inspection.txt"
          fi
          cat "$OUT/TEST_SUMMARY.txt" || true

      - name: Enable KVM for the emulator
        if: always()
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install + launch on emulator (API 35)
        id: emu
        if: always() && hashFiles('formulabook-build/FormulaBook-debug.apk') != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: .
          script: bash formulabook/ci/emulator_smoke.sh formulabook-build/FormulaBook-debug.apk formulabook-build/device

      - name: Commit build outputs and reports
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "commit=${GITHUB_SHA::7} emulator=${{ steps.emu.outcome }}" > formulabook-build/BUILD_INFO.txt
          git add -f formulabook-build
          git commit -m "CI FormulaBook build ${GITHUB_SHA::7} (emulator: ${{ steps.emu.outcome }})" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Fail if tests or build failed
        if: always()
        run: |
          grep -q "BUILD SUCCESSFUL" ../fb-unit-tests.log || { echo "unit tests failed"; exit 1; }
          grep -q "BUILD SUCCESSFUL" ../fb-build.log || { echo "build failed"; exit 1; }
