name: Build Haang Phi 100 APK

on:
  push:
    paths: [ 'haang-phi-100/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haang-phi-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: rm -f local.properties && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HaangPhi100-apk
          path: haang-phi-100/app/build/outputs/apk/debug/app-debug.apk
