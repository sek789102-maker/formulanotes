name: LIFEKEEP signed release verification

# Verifies the upload-key-signed AAB/APK committed under release/signed/.
# Contains no secrets: only the public certificate fingerprint is compared.
on:
  push:
    branches: [ 'claude/lifekeep-**' ]
    paths:
      - 'release/signed/*.aab'
      - 'release/signed/*.apk'
      - '.github/workflows/lifekeep-release-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signatures and certificate
        run: |
          set -euo pipefail
          cd release/signed
          OUT=verification; mkdir -p "$OUT"
          AAB=$(ls *.aab | head -1); APK=$(ls *.apk | head -1)
          EXPECTED=$(tr -d ' :\n' < upload-certificate-sha256.txt | tr 'a-f' 'A-F')
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          curl -sL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          {
            echo "# Signed release verification"
            echo; echo "- Commit: ${GITHUB_SHA::7}  ·  build-tools $BT"
            echo; echo "## App Bundle ($AAB)"
            java -jar /tmp/bundletool.jar validate --bundle="$AAB" > /dev/null && echo "- ✅ bundletool validate: OK"
            jarsigner -verify -strict "$AAB" > /tmp/js.txt 2>&1 && echo "- ✅ jarsigner -verify -strict: $(grep -o 'jar verified.' /tmp/js.txt)"
            AAB_SHA=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ' :')
            [ "$AAB_SHA" = "$EXPECTED" ] && echo "- ✅ AAB signed by upload certificate (SHA-256 matches)" || { echo "- ❌ AAB certificate mismatch"; exit 1; }
            echo; echo "## APK ($APK)"
            $ANDROID_HOME/build-tools/$BT/apksigner verify --verbose --print-certs "$APK" > /tmp/as.txt
            grep -E "Verified using v[0-9]+ scheme" /tmp/as.txt | sed 's/^/- /'
            APK_SHA=$(grep -m1 'certificate SHA-256 digest' /tmp/as.txt | sed 's/.*: //' | tr 'a-f' 'A-F')
            [ "$APK_SHA" = "$EXPECTED" ] && echo "- ✅ APK signed by upload certificate (SHA-256 matches)" || { echo "- ❌ APK certificate mismatch"; exit 1; }
            $ANDROID_HOME/build-tools/$BT/aapt2 dump badging "$APK" | grep -E "^(package|targetSdkVersion|sdkVersion)" | sed 's/^/- /'
          } | tee "$OUT/verification.md"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install & launch signed APK on emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install release/signed/$(ls release/signed | grep '\.apk$' | head -1) && echo "- ✅ installed on emulator" >> release/signed/verification/verification.md
            adb shell am start -W -n com.sek789102.lifekeep/com.lifekeep.app.MainActivity > /dev/null; sleep 10
            [ -n "$(adb shell pidof com.sek789102.lifekeep)" ] && echo "- ✅ app running 10 s after launch" >> release/signed/verification/verification.md || echo "- ❌ app not running" >> release/signed/verification/verification.md
            adb exec-out screencap -p > release/signed/verification/signed_apk_launch.png
            adb logcat -d | grep -cE "FATAL EXCEPTION|E/flutter" | sed 's/^/- crash\/error lines in logcat: /' >> release/signed/verification/verification.md

      - name: Commit verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/signed/verification
          git commit -m "Verify signed release (${GITHUB_SHA::7})" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push
