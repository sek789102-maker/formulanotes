name: Build Play Store Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o "*.zip" || true
          if [ ! -f "build.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -r "$SUBDIR"/. .
            fi
          fi

      - name: Prepare Package Name and Target SDK for Play Store
        run: |
          find . -type f \( -name "*.kt" -o -name "*.kts" -o -name "*.xml" -o -name "*.pro" \) -exec sed -i 's/com\.CHANGE_ME\.formulanotes/com.sek789102.formulanotes/g' {} +
          for dir in app/src/main/java/com app/src/test/java/com app/src/androidTest/java/com; do
            if [ -d "$dir/CHANGE_ME" ]; then
              mv "$dir/CHANGE_ME" "$dir/sek789102"
            fi
          done
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' app/build.gradle.kts
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Keystores
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore release.keystore -storepass Formulanotes@2026 -alias release_key -keypass Formulanotes@2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sek,O=FormulaNotes,C=TH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build & Sign Release AAB for Play Store
        run: |
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=Formulanotes@2026 \
            -Pandroid.injected.signing.key.alias=release_key \
            -Pandroid.injected.signing.key.password=Formulanotes@2026

      - name: Upload Play Store Bundle & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Ready-Package
          path: |
            app/build/outputs/bundle/release/app-release.aab
            release.keystore
